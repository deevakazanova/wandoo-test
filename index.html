<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wandoo · тестовое задание — Нина Деева-Казанова</title>
<style>
  :root { --bg:#E9EBEC; --ink:#23262D; --lime:#D4FF5B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; color:var(--ink);
    -webkit-tap-highlight-color:transparent; user-select:none; }
  .wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px 16px 72px; }
  .stage { position:relative; aspect-ratio:1728/1117; width:min(100%, calc((100vh - 88px) * 1728 / 1117));
    border-radius:18px; overflow:hidden; background:#F5F6F7; transition:background-color .55s ease; box-shadow:0 10px 40px rgba(35,38,45,.12); }
  .slide { position:absolute; inset:0; opacity:0; visibility:hidden; transform:scale(1.015);
    transition:opacity .55s ease, transform .7s cubic-bezier(.2,.7,.2,1), visibility 0s linear .55s; }
  .slide.on { opacity:1; visibility:visible; transform:none; transition:opacity .55s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
  .slide > img.bg { position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover; }
  /* phone screen overlay: x 1196, y 168, w 402, h 874 in 1728x1117 slide */
  .screen { position:absolute; left:69.2130%; top:15.0403%; width:23.2639%; height:78.2453%;
    overflow:hidden; border-radius:13.43% / 6.18%; }
  .screen img { position:absolute; left:0; top:0; width:100%; display:block; }
  .scroll { transition:transform 2.8s cubic-bezier(.45,0,.25,1); }
  .p14 { position:absolute; left:0; top:0; width:402px; height:874px; transform-origin:0 0; overflow:hidden; background:#F2F2F7; }
  .p14 img { position:absolute; left:0; top:0; display:block; width:auto; max-width:none; }
  .p14 .bgm { width:402px; }
  .p14 .btns { top:54px; width:402px; transition:opacity .55s ease-out; }
  .p14 .sheet { position:absolute; left:0; top:210px; width:402px; height:762px; }
  .p14 .sheet > img { width:402px; }
  .p14 .vp { position:absolute; left:0; top:85px; width:402px; height:677px; overflow:hidden; }
  .p14 .feed { position:absolute; left:0; top:0; width:402px; height:2643px; }
  .p14 .feed > img { width:402px; }
  .p14 .clip { position:absolute; left:16px; width:370px; overflow:hidden; }
  .p14 .home { position:absolute; left:132px; bottom:8px; width:138px; height:5px; border-radius:3px; background:#1C1C1E; }
  .bar { position:fixed; left:0; right:0; bottom:0; height:64px; display:flex; align-items:center; justify-content:center; gap:14px; }
  .btn { width:44px; height:44px; border-radius:22px; border:0; background:#fff; color:var(--ink); font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .btn:active { transform:scale(.95); }
  .count { min-width:72px; text-align:center; font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; }
  .prog { position:fixed; left:0; top:0; height:3px; background:var(--ink); transition:width .4s ease; }
  .hint { position:fixed; bottom:20px; right:20px; font-size:12px; opacity:.5; }
  @media (max-width:700px){ .hint{display:none} .wrap{padding:8px 8px 68px} .stage{border-radius:10px} }
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div class="wrap"><div class="stage" id="stage"></div></div>
<div class="bar">
  <button class="btn" id="prev" aria-label="Назад">←</button>
  <div class="count" id="count">1 / 15</div>
  <button class="btn" id="next" aria-label="Вперёд">→</button>
</div>
<div class="hint">← → или тап по слайду</div>
<script>
(function(){
  const N=15, stage=document.getElementById('stage');
  const slides=[];
  for(let i=1;i<=N;i++){
    const s=document.createElement('section'); s.className='slide'; s.id='s'+i;
    const img=document.createElement('img'); img.className='bg'; img.alt='Слайд '+i; img.src='img/s'+String(i).padStart(2,'0')+'.jpg';
    s.appendChild(img);
    if(i===11){
      const sc=document.createElement('div'); sc.className='screen';
      sc.innerHTML='<img class="scroll" src="img/p11-content-v2.jpg" alt=""><img src="img/p11-fixed.png" alt="">';
      s.appendChild(sc);
    }
    if(i===14){
      const sc=document.createElement('div'); sc.className='screen';
      sc.innerHTML='<div class="p14"><img class="bgm" src="img/p14-bg.jpg" alt=""><img class="btns" src="img/p14-btns.webp" alt="">'+
        '<div class="sheet"><img src="img/p14-sheet.webp" alt=""><div class="vp"><div class="feed"><img src="img/p14-feed.webp" alt="">'+
        [['A',145,291,956],['C',798,201,668],['D',1118,290,656],['F',1764,239,920]].map(([k,y,h,w])=>'<div class="clip" style="top:'+y+'px;height:'+h+'px"><img class="tr'+k+'" src="img/p14-track'+k+'.webp" style="width:'+w+'px" alt=""></div>').join('')+
        '</div></div></div><div class="home"></div></div>';
      s.appendChild(sc);
    }
    stage.appendChild(s); slides.push(s);
  }
  // Figma prototype timeline for slide 14: [hold before, duration, step]
  const EO='cubic-bezier(0,0,.58,1)', EIO='cubic-bezier(.42,0,.58,1)';
  const seq14=[[1.0,.55,'expand'],[.4,.6,['A',-312]],[.5,1.1,-673],[.5,.6,['C',-324]],[.5,1.1,-987],[.5,.6,['D',-212]],[.5,1.1,-1671],[.5,.6,['F',-300]],[.5,1.1,-1965]];
  function fit14(){ const sc=slides[13].querySelector('.screen'), p=sc.querySelector('.p14'); p.style.transform='scale('+(sc.clientWidth/402)+')'; }
  window.addEventListener('resize',fit14);
  let cur=0, timers=[];
  const clear=()=>{ timers.forEach(clearTimeout); timers=[]; };
  function resetAnims(){
    const sc=slides[10].querySelector('.scroll'); sc.style.transition='none'; sc.style.transform='none'; void sc.offsetWidth; sc.style.transition='';
    const p=slides[13]; p.querySelectorAll('.sheet,.feed,.btns,.clip img').forEach(n=>n.style.transition='none');
    p.querySelector('.sheet').style.top='210px'; p.querySelector('.feed').style.transform='none'; p.querySelector('.btns').style.opacity=1;
    p.querySelectorAll('.clip img').forEach(n=>n.style.transform='none'); fit14();
  }
  function play(i){
    if(i===10){
      timers.push(setTimeout(()=>{
        const box=slides[10].querySelector('.screen'), im=box.querySelector('.scroll');
        const d=im.getBoundingClientRect().height-box.getBoundingClientRect().height;
        im.style.transform='translateY(-'+Math.max(0,d)+'px)';
      },1500));
    }
    if(i===13){
      const p=slides[13]; let t=0;
      seq14.forEach(([hold,dur,step])=>{ t+=hold*1000;
        timers.push(setTimeout(()=>{
          if(step==='expand'){ const sh=p.querySelector('.sheet'), b=p.querySelector('.btns');
            sh.style.transition='top '+dur+'s '+EO; sh.style.top='112px'; b.style.transition='opacity '+dur+'s '+EO; b.style.opacity=0; }
          else if(typeof step==='number'){ const f=p.querySelector('.feed'); f.style.transition='transform '+dur+'s '+EIO; f.style.transform='translateY('+step+'px)'; }
          else { const im=p.querySelector('.tr'+step[0]); im.style.transition='transform '+dur+'s '+EO; im.style.transform='translateX('+step[1]+'px)'; }
        },t));
        t+=dur*1000; });
    }
  }
  function go(i){
    i=Math.max(0,Math.min(N-1,i)); clear(); resetAnims();
    slides.forEach((s,k)=>s.classList.toggle('on',k===i)); cur=i; stage.style.backgroundColor=(i===0?'#E2F7AC':'#F5F6F7');
    document.getElementById('count').textContent=(i+1)+' / '+N;
    document.getElementById('prog').style.width=((i+1)/N*100)+'%';
    try{ if(location.hash!=='#s'+(i+1)) history.replaceState(null,'','#s'+(i+1)); }catch(e){}
    play(i);
  }
  document.getElementById('next').onclick=e=>{e.stopPropagation();go(cur+1)};
  document.getElementById('prev').onclick=e=>{e.stopPropagation();go(cur-1)};
  stage.addEventListener('click',e=>{ const r=stage.getBoundingClientRect(); (e.clientX-r.left<r.width*0.3)?go(cur-1):go(cur+1); });
  document.addEventListener('keydown',e=>{
    if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1)}
    else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
    else if(e.key==='Home')go(0); else if(e.key==='End')go(N-1);
  });
  let sx=null,sy=null;
  stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  stage.addEventListener('touchend',e=>{ if(sx===null)return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){ e.preventDefault(); dx<0?go(cur+1):go(cur-1); } sx=null; });
  window.addEventListener('hashchange',()=>{ const m=/^#s(\d+)$/.exec(location.hash); if(m&&+m[1]-1!==cur) go(+m[1]-1); });
  const m=/^#s(\d+)$/.exec(location.hash); go(m?+m[1]-1:0);
})();
</script>
</body>
</html>
